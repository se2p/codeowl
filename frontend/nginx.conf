server {
  listen 80;
  server_name _;

  # Serve the built Vite app
  root /usr/share/nginx/html;
  index index.html;

  # --- Healthcheck for Docker ---
  location = /health {
    add_header Content-Type text/plain;
    return 200 "ok";
  }

      # --- Cache static assets aggressively (but never index.html) ---
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|otf|eot)$ {
      try_files $uri =404;
      access_log off;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location = /index.html {
      add_header Cache-Control "no-store" always;
      try_files $uri =404;
    }

  location = /codeowl/worksheets/study1 {
    return 302 /codeowl/worksheets/e7711195-5334-4f3b-819c-c085277b9062;
  }

  location = /codeowl/worksheets/study2 {
    return 302 /codeowl/worksheets/8f4b91e1-7a42-4d19-aaa9-8d12beee5f13;
  }

    location = /codeowl/tworksheets/study1 {
      return 302 /codeowl/tworksheets/e7711195-5334-4f3b-819c-c085277b9062;
    }

    location = /codeowl/tworksheets/study2 {
      return 302 /codeowl/tworksheets/8f4b91e1-7a42-4d19-aaa9-8d12beee5f13;
    }

  # --- Reverse-proxy API requests to backend ---
  location /codeowl/api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- SPA fallback (React Router) ---
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ^~ /jsparsons/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

}
