# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/development/cicd/templates/
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

stages:          # List of stages for jobs, and their order of execution
  - build
  - test
  - deploy

frontend-build:  # tsc -b (typechecks src and tests) + vite production bundle.
  stage: build
  image: node:24
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

backend-build:   # Compiles and packages the Spring Boot jar via the Maven wrapper.
  stage: build
  image: eclipse-temurin:21-jdk   # Matches java.version in backend/pom.xml.
  cache:
    key:
      files:
        - backend/pom.xml
    paths:
      - backend/.m2/repository/
  before_script:
    - cd backend
    # The repository is also worked on from Windows, where the executable bit on
    # mvnw is easily lost; without this a stray mode change breaks every pipeline.
    - chmod +x mvnw
  script:
    # Tests are skipped here on purpose: they belong in the test stage, which is where
    # the database service that the *DatabaseTest classes need is configured.
    - ./mvnw -B -ntp -Dmaven.repo.local=.m2/repository package -DskipTests
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 week

frontend-test:   # Runs the vitest suite in frontend/.
  stage: test    # It only starts when the job in the build stage completes successfully.
  image: node:24
  cache:         # Reuse the npm cache across pipelines, keyed on the lockfile.
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm test -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
  artifacts:
    when: always # Keep the report on failure too, that is when it is worth reading.
    expire_in: 1 week
    reports:
      junit: frontend/junit.xml  # Paths are relative to the project root, not the job cwd.

backend-test:    # Runs the JUnit suite in backend/, database tests included.
  stage: test
  image: eclipse-temurin:21-jdk   # Matches java.version in backend/pom.xml.
  cache:
    key:
      files:
        - backend/pom.xml
    paths:
      - backend/.m2/repository/
  variables:
    # A throwaway Postgres for the life of this job and no longer: GitLab starts the
    # service container beside the job, the tests migrate it from V1, and it is destroyed
    # with the job. Nothing persists between pipelines, so every run starts from an empty
    # schema and no run can be contaminated by the one before it.
    #
    # The *DatabaseTest classes used to reach for Testcontainers and skip when it found no
    # daemon, which on this runner is always: it is unprivileged, so docker:dind dies on
    # "mount: permission denied" before it listens. Handing the tests a database instead of
    # letting them build one is what gets them running here. See TestDatabase.
    FF_NETWORK_PER_BUILD: "true"   # Job and service on one network, addressable by alias.
    CI_DEBUG_SERVICES: "true"      # Service container logs in the job output, for when it is not.
    # Read by TestDatabase, and the same names application.yml reads in production.
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/codeowl"
    SPRING_DATASOURCE_USERNAME: codeowl
    SPRING_DATASOURCE_PASSWORD: codeowl
  services:
    # 17-alpine matches the deployment and carries contrib, which V19's unaccent needs.
    - name: docker.io/library/postgres:17-alpine
      alias: postgres
      variables:
        POSTGRES_DB: codeowl
        POSTGRES_USER: codeowl
        POSTGRES_PASSWORD: codeowl
  before_script:
    - cd backend
    # The executable bit on mvnw is easily lost when the repository is edited
    # from Windows; without this the job dies on a bare permission denied.
    - chmod +x mvnw
    # GitLab starts the service and the job together rather than waiting for Postgres to
    # finish initialising, so the first connection can beat the database to it. Maven is
    # usually slow enough to hide that; this makes it not a matter of luck.
    - >
      for i in $(seq 1 60); do
        (echo > /dev/tcp/postgres/5432) 2>/dev/null && break
        echo "waiting for postgres ($i/60)"; sleep 1
      done
  script:
    - ./mvnw -B -ntp -Dmaven.repo.local=.m2/repository test
  artifacts:
    when: always # Keep the reports on failure too, that is when they are read.
    expire_in: 1 week
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml

lint-test-job:   # This job also runs in the test stage.
  stage: test    # It can run at the same time as unit-test-job (in parallel).
  script:
    - echo "Linting code... This will take about 10 seconds."
    - sleep 10
    - echo "No lint issues found."

deploy-job:      # This job runs in the deploy stage.
  stage: deploy  # It only runs when *both* jobs in the test stage complete successfully.
  environment: production
  script:
    - echo "Deploying application..."
    - echo "Application successfully deployed."

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
